# CI — rustfmt, clippy -D warnings, cargo test, host node:test, shellcheck, and the release
# WASM build. Same gates as `make quality` and `make wasm`.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # docker-run.sh forks on this: run the in-container gate without Compose.
  DRAW_ENGINE_IN_DOCKER: "1"

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # SC1128: 42-school banner sits above the shebang (scripts are invoked as bash).
          # SC1091: sourced helpers are not followed from CI.
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck -S error -e SC1091 -e SC1128

  quality:
    name: Quality & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: rustfmt, clippy, cargo test, host tests
        run: bash scripts/docker-run.sh quality

  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli at the crate's pin
        run: |
          # The CLI must match `wasm-bindgen = "=<version>"` exactly, or the glue it writes
          # disagrees with the binary and fails in the browser rather than here.
          version="$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/draw-engine/Cargo.toml)"
          test -n "${version}"
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1
          wasm-bindgen --version

      - name: Build both modules into pkg/ (warnings are errors)
        run: bash scripts/docker-run.sh wasm
