[package]
name = "draw-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Canvas2D drawing engine core (Excalidraw/Figma-class)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The rough.js port. Held bit-compatible with roughjs 4.6.4 by its own oracle suite;
# this is what makes shapes look like Excalidraw rather than like a CAD tool.
draw-rough = { path = "../draw-rough" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
    "TextMetrics",
    "Blob",
    # Path2D lets a shape be built once and stroked with a single call per frame,
    # instead of thousands of move/line/curve calls crossing the WASM boundary.
    "Path2d",
    # Decoding an inserted image. Kept decoded between frames; the element carries the
    # `data:` URL and the painter turns it into pixels once.
    "HtmlImageElement",
] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

# NFC for the text wrapper's tokenizer (src/text/wrap.rs). In the browser the platform's
# own `String.prototype.normalize` does it — what the oracle calls — so the crate stays
# out of the wasm, where it measured +128,879 bytes (+71,736 gzipped) on a 1,355,882-byte
# module. Natively (tests, benches) it stands in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
# default-features = false drops plotters and rayon: smaller, and friendlier to the
# offline build in scripts/docker-run.sh.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "editing"
harness = false
