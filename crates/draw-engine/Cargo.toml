[package]
name = "draw-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Canvas2D drawing engine core (Excalidraw/Figma-class)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The rough.js port. Held bit-compatible with roughjs 4.6.4 by its own oracle suite;
# this is what makes shapes look like Excalidraw rather than like a CAD tool.
draw-rough = { path = "../draw-rough" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
    "TextMetrics",
    "Blob",
] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# default-features = false drops plotters and rayon: smaller, and friendlier to the
# offline build in scripts/docker-run.sh.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render"
harness = false
